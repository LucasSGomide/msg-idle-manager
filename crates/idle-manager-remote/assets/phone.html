<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1e1e1e">
  <meta name="idle-manager-device-id" content="{{idle-manager-device-id}}">
  <meta name="idle-manager-secret" content="{{idle-manager-secret}}">
  <title>Idle Manager</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --fg: #ffffff;
      --dim: rgba(255, 255, 255, 0.55);
      --line: rgba(255, 255, 255, 0.12);
      --raised: #2b2b2b;
      --accent: #3584e4;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Cantarell, sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }
    [hidden] { display: none !important; }
    .screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
    }
    .stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      height: 100%;
      padding: 24px;
      text-align: center;
    }
    .dim { color: var(--dim); }
    .word { font-size: 15px; }
    .name { font-size: 20px; }
    .switch-label { font-size: 20px; }
    .switch {
      position: relative;
      width: 96px;
      height: 52px;
      padding: 0;
      border: 0;
      border-radius: 26px;
      background: #5e5e5e;
      transition: background 150ms;
      cursor: pointer;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 44px;
      height: 44px;
      border-radius: 22px;
      background: var(--fg);
      transition: transform 150ms;
    }
    .switch[aria-checked="true"] { background: var(--accent); }
    .switch[aria-checked="true"]::after { transform: translateX(44px); }
    .switch:disabled { opacity: 0.4; cursor: default; }
    .switch.small { width: 60px; height: 32px; border-radius: 16px; }
    .switch.small::after { width: 26px; height: 26px; top: 3px; left: 3px; }
    .switch.small[aria-checked="true"]::after { transform: translateX(28px); }
    .button {
      min-width: 120px;
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      background: var(--raised);
      color: var(--fg);
      font: inherit;
      font-size: 17px;
      cursor: pointer;
    }
    .button:active { background: #383838; }
    .button:disabled { opacity: 0.4; cursor: default; }

    #frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      touch-action: none;
      transition: opacity 200ms;
    }
    #frame.dimmed { opacity: 0.35; }
    #reconnecting {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      font-size: 18px;
    }
    #handle {
      position: absolute;
      top: calc(12px + var(--safe-top));
      left: calc(12px + var(--safe-left));
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 22px;
      background: rgba(30, 30, 30, 0.55);
      color: var(--fg);
      font-size: 22px;
      line-height: 44px;
      text-align: center;
      cursor: pointer;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    #scrim {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms;
    }
    #list {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: min(82%, 360px);
      display: flex;
      flex-direction: column;
      background: var(--bg);
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
      transform: translateX(-102%);
      transition: transform 220ms ease-out;
      padding-top: var(--safe-top);
      padding-left: var(--safe-left);
      padding-bottom: var(--safe-bottom);
    }
    #game.list-open #list { transform: translateX(0); }
    #game.list-open #scrim { opacity: 1; pointer-events: auto; }
    #workspaces {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 0;
    }
    #workspaces h2 {
      margin: 12px 16px 4px;
      font-size: 15px;
      font-weight: normal;
      color: var(--dim);
    }
    #workspaces .empty {
      margin: 4px 16px 12px 24px;
      font-size: 15px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px 4px 16px;
    }
    .row.current { background: rgba(255, 255, 255, 0.08); }
    .row .pick {
      flex: 1;
      min-width: 0;
      padding: 8px 8px;
      border: 0;
      background: none;
      color: var(--fg);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .row .pick .label {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .row.dimmed .pick .label { color: var(--dim); }
    .row .pick .word { display: block; color: var(--dim); font-size: 13px; }
    .row .action { min-width: 84px; padding: 8px 12px; font-size: 15px; }
    #list-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <section id="toggle" class="screen" hidden>
    <div class="stack">
      <span class="switch-label">Mobile mode</span>
      <button id="toggle-switch" class="switch" type="button" role="switch" aria-checked="false" aria-label="Mobile mode" disabled></button>
      <p id="toggle-line" class="dim">Connecting…</p>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <canvas id="frame"></canvas>
    <div id="absent" class="stack" hidden>
      <span id="absent-name" class="name"></span>
      <span id="absent-word" class="word dim"></span>
      <button id="absent-start" class="button" type="button">Start</button>
    </div>
    <div id="empty" class="stack" hidden>
      <span class="dim">No games in this workspace</span>
    </div>
    <div id="reconnecting" hidden><span>Reconnecting…</span></div>
    <button id="handle" type="button" aria-label="Accounts">≡</button>
    <div id="scrim"></div>
    <aside id="list" aria-label="Accounts">
      <div id="workspaces"></div>
      <div id="list-foot">
        <span class="switch-label">Mobile mode</span>
        <button id="list-switch" class="switch small" type="button" role="switch" aria-checked="true" aria-label="Mobile mode"></button>
      </div>
    </aside>
  </section>

  <section id="refused" class="screen" hidden>
    <div class="stack">
      <span class="dim">This phone is no longer enrolled</span>
    </div>
  </section>

  <script>
    // BEGIN pure

        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,

      function loadCredential() {

        var fresh = {
          deviceId: metas.deviceId ? metas.deviceId.getAttribute('content') : '',
          secret: metas.secret ? metas.secret.getAttribute('content') : ''
        };
        if (metas.deviceId) { metas.deviceId.parentNode.removeChild(metas.deviceId); }
        if (metas.secret) { metas.secret.parentNode.removeChild(metas.secret); }
        var stored = null;
        var storedDeviceId = null;
        try {
          if (fresh.secret) {
            window.localStorage.setItem(STORAGE_DEVICE_ID, fresh.deviceId);
            window.localStorage.setItem(STORAGE_SECRET, fresh.secret);
          }
          stored = window.localStorage.getItem(STORAGE_SECRET);
          storedDeviceId = window.localStorage.getItem(STORAGE_DEVICE_ID);
        } catch (error) {
          stored = null;
          storedDeviceId = null;
        }
        var secret = fresh.secret || stored || '';
        deviceIdHex = fresh.deviceId || storedDeviceId || queryDeviceId() || null;
        if (deviceIdHex !== null && window.history && typeof window.history.replaceState === 'function'
            && window.location.pathname + window.location.search !== pageAddress()) {
          // The address the phone keeps — in its history, its bookmark, its
          // home-screen icon — is `/?d=<device id>`: never the one-shot
          // enrolment code, which is already spent, and never a bare `/`,
          // which needs the cookie a home-screen web app's own jar may not
          // hold. The id names this phone; the secret in storage proves it.
          window.history.replaceState(null, '', pageAddress());
        }
        return pure.hexToBytes(secret) !== null && secret.length > 0 ? secret : null;
      }

      function queryDeviceId() {
        var match = /[?&]d=([0-9a-f]+)/.exec(window.location.search);
        return match ? match[1] : null;
      }

      // `/?d=<device id>`: the page's own address, and the socket's, so both
      // work whether or not this browser sends the cookie.
      function pageAddress() {
        return deviceIdHex === null ? '/' : '/?d=' + deviceIdHex;
      }

      function show(screen) {
        el.toggle.hidden = screen !== 'toggle';
        el.game.hidden = screen !== 'game';
        el.refused.hidden = screen !== 'refused';
      }

      function shouldAttach() {
        return phase === 'open'
          && document.visibilityState === 'visible'
          && state !== null
          && state.mobileMode === true
          && state.current !== null && state.current !== undefined;
      }

      function currentViewport() {
        return { width: Math.max(1, Math.round(window.innerWidth)), height: Math.max(1, Math.round(window.innerHeight)) };
      }

      function sameViewport(a, b) {
        return a !== null && b !== null && a.width === b.width && a.height === b.height;
      }

      function send(message) {
        if (socket === null || socket.readyState !== 1) { return false; }
        socket.send(JSON.stringify(message));
        return true;
      }

      function sendIntent(message) {
        if (phase !== 'open') { return; }
        send(message);
      }

      function syncPresence() {
        var wanted = shouldAttach();
        var viewport = currentViewport();
        if (wanted && (!attached || !sameViewport(attachedViewport, viewport))) {
          if (send({ type: 'attach', viewport: viewport })) {
            attached = true;
            attachedViewport = viewport;
          }
        } else if (!wanted && attached) {
          send({ type: 'leave' });
          attached = false;
          attachedViewport = null;
        }
      }

      function leaveNow() {
        if (attached) {
          send({ type: 'leave' });
          attached = false;
          attachedViewport = null;
        }
      }

      function render() {
        if (phase === 'refused') {
          show('refused');
          return;
        }
        if (state === null || state.mobileMode !== true) {
          renderToggle();
          return;
        }
        renderGame();
      }

      function renderToggle() {
        show('toggle');
        listOpen = false;
        el.game.classList.remove('list-open');
        var connected = phase === 'open' && state !== null;
        el.toggleSwitch.disabled = !connected;
        el.toggleSwitch.setAttribute('aria-checked', 'false');
        el.toggleLine.textContent = connected
          ? 'Turn it on to see a game here'
          : (everWelcomed ? 'Reconnecting…' : 'Connecting…');
      }

      function renderGame() {
        show('game');
        var connected = phase === 'open';
        var workspace = pure.shownWorkspace(state);
        var account = pure.currentAccount(state);
        var noAccounts = workspace === null || (workspace.accounts || []).length === 0;
        var absent = account !== null && account.liveness !== 'live';
        el.empty.hidden = !noAccounts;
        el.absent.hidden = noAccounts || !absent;
        el.frame.hidden = noAccounts || absent;
        if (absent) {
          el.absentName.textContent = account.name;
          el.absentWord.textContent = pure.capitalise(account.liveness);
          el.absentStart.disabled = !connected || !pure.actionFor(account.liveness).sensitive;
        }
        el.frame.classList.toggle('dimmed', !connected);
        el.reconnecting.hidden = connected;
        el.game.classList.toggle('list-open', listOpen);
        renderList();
        drawFrame();
      }

      // The rows are rebuilt only when what they show changed, so a burst of
      // state messages cannot replace a button under a finger mid-press.
      function renderList() {
        var key = JSON.stringify([phase, state.current, state.workspaces]);
        if (key === renderedListKey) { return; }
        renderedListKey = key;
        var scrollTop = el.workspaces.scrollTop;
        while (el.workspaces.firstChild) { el.workspaces.removeChild(el.workspaces.firstChild); }
        var workspaces = state.workspaces || [];
        for (var i = 0; i < workspaces.length; i++) {
          var heading = document.createElement('h2');
          heading.textContent = workspaces[i].name;
          el.workspaces.appendChild(heading);
          var accounts = workspaces[i].accounts || [];
          if (accounts.length === 0) {
            var empty = document.createElement('p');
            empty.className = 'empty dim';
            empty.textContent = 'No accounts';
            el.workspaces.appendChild(empty);
          }
          for (var j = 0; j < accounts.length; j++) {
            el.workspaces.appendChild(renderRow(accounts[j]));
          }
        }
        el.workspaces.scrollTop = scrollTop;
        el.listSwitch.setAttribute('aria-checked', 'true');
        el.listSwitch.disabled = phase !== 'open';
      }

      function renderRow(account) {
        var row = document.createElement('div');
        row.className = 'row';
        if (account.id === state.current) { row.classList.add('current'); }
        // Design rule 3: a parked or queued account's name is dimmed.
        if (account.liveness === 'parked' || account.liveness === 'queued') { row.classList.add('dimmed'); }
        var pick = document.createElement('button');
        pick.type = 'button';
        pick.className = 'pick';
        var label = document.createElement('span');
        label.className = 'label';
        label.textContent = account.name;
        var word = document.createElement('span');
        word.className = 'word';
        word.textContent = account.liveness;
        pick.appendChild(label);
        pick.appendChild(word);
        pick.addEventListener('click', function () {
          sendIntent({ type: 'choose', account: account.id });
          setListOpen(false);
        });
        var action = pure.actionFor(account.liveness);
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'button action';
        button.textContent = action.label;
        button.disabled = phase !== 'open' || !action.sensitive;
        button.addEventListener('click', function () {
          sendIntent({ type: account.liveness === 'live' ? 'park' : 'start', account: account.id });
        });
        row.appendChild(pick);
        row.appendChild(button);
        return row;
      }

      function setListOpen(open) {
        listOpen = open;
        el.game.classList.toggle('list-open', listOpen);
      }

      function sizeCanvas() {
        var ratio = window.devicePixelRatio || 1;
        var width = Math.max(1, Math.round(window.innerWidth));
        var height = Math.max(1, Math.round(window.innerHeight));
        if (el.frame.width !== Math.round(width * ratio) || el.frame.height !== Math.round(height * ratio)) {
          el.frame.width = Math.round(width * ratio);
          el.frame.height = Math.round(height * ratio);
        }
        return { width: width, height: height, ratio: ratio };
      }

      function drawFrame() {
        var size = sizeCanvas();
        context.setTransform(size.ratio, 0, 0, size.ratio, 0, 0);
        context.fillStyle = '#000';
        context.fillRect(0, 0, size.width, size.height);
        if (frame === null) { fit = null; return; }
        fit = pure.fitFrame(frame.width, frame.height, size.width, size.height);
        context.drawImage(frame.image, fit.offsetX, fit.offsetY, fit.width, fit.height);
      }

      function decodeFrame(buffer) {
        var header = pure.parseFrameHeader(buffer);
        if (header === null) { return; }
        if (decoding) { pendingFrame = buffer; return; }
        decoding = true;
        var jpeg = new Blob([new Uint8Array(buffer, header.jpegOffset)], { type: 'image/jpeg' });
        decodeJpeg(jpeg, function (image) {
          decoding = false;
          if (image !== null) {
            if (frame !== null && typeof frame.image.close === 'function') { frame.image.close(); }
            frame = { image: image, width: header.width, height: header.height };
            drawFrame();
          }
          if (pendingFrame !== null) {
            var next = pendingFrame;
            pendingFrame = null;
            decodeFrame(next);
          }
        });
      }

      function decodeJpeg(blob, done) {
        if (typeof window.createImageBitmap === 'function') {
          window.createImageBitmap(blob).then(done, function () { decodeWithImage(blob, done); });
        } else {
          decodeWithImage(blob, done);
        }
      }

      function decodeWithImage(blob, done) {
        var url = URL.createObjectURL(blob);
        var image = new Image();
        image.onload = function () { URL.revokeObjectURL(url); done(image); };
        image.onerror = function () { URL.revokeObjectURL(url); done(null); };
        image.src = url;
      }

      function canvasPoint(event) {
        var rect = el.frame.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      }

      function onPointerDown(event) {
        if (!event.isPrimary || listOpen) { return; }
        event.preventDefault();
        var point = canvasPoint(event);
        press = pure.beginPress(point.x, point.y, event.timeStamp);
        if (typeof el.frame.setPointerCapture === 'function') {
          try { el.frame.setPointerCapture(event.pointerId); } catch (error) { /* a pointer already gone */ }
        }
      }

      function onPointerMove(event) {
        if (press === null || !event.isPrimary) { return; }
        var point = canvasPoint(event);
        var moved = pure.movePress(press, point.x, point.y, event.timeStamp);
        press = moved.press;
        if (moved.scroll === null || fit === null || !attached) { return; }
        var at = pure.toViewport({ x: press.startX, y: press.startY }, fit);
        var delta = pure.toViewportDelta(moved.scroll.dx, moved.scroll.dy, fit);
        if (delta.dx === 0 && delta.dy === 0) { return; }
        sendIntent({ type: 'scroll', x: at.x, y: at.y, dx: delta.dx, dy: delta.dy });
      }

      function onPointerUp(event) {
        if (press === null || !event.isPrimary) { return; }
        var point = canvasPoint(event);
        var ended = pure.endPress(press, point.x, point.y, event.timeStamp);
        var start = press;
        press = null;
        if (ended !== 'tap') { return; }
        askFullscreen();
        if (fit === null || !attached) { return; }
        var at = pure.toViewport({ x: start.startX, y: start.startY }, fit);
        sendIntent({ type: 'tap', x: at.x, y: at.y });
      }

      function onPointerCancel() {
        press = null;
      }

      function askFullscreen() {
        if (fullscreenAsked) { return; }
        fullscreenAsked = true;
        var root = document.documentElement;
        var request = root.requestFullscreen || root.webkitRequestFullscreen;
        if (typeof request !== 'function' || document.fullscreenElement) { return; }
        try {
          var outcome = request.call(root, { navigationUI: 'hide' });
          if (outcome && typeof outcome.catch === 'function') { outcome.catch(function () { /* not allowed here */ }); }
        } catch (error) { /* not allowed here */ }
      }

      function socketUrl() {
        var scheme = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        return scheme + window.location.host + '/ws' + (deviceIdHex === null ? '' : '?d=' + deviceIdHex);
      }

      function connect() {
        if (retryTimer !== null) { clearTimeout(retryTimer); retryTimer = null; }
        if (phase === 'refused') { return; }
        phase = 'connecting';
        authSent = false;
        attached = false;
        attachedViewport = null;
        ownChallenge = pure.randomHex(CHALLENGE_BYTES, window.crypto && window.crypto.getRandomValues
          ? window.crypto.getRandomValues.bind(window.crypto) : null);
        render();
        var opened;
        try {
          opened = new WebSocket(socketUrl());
        } catch (error) {
          scheduleRetry();
          return;
        }
        socket = opened;
        socket.binaryType = 'arraybuffer';
        socket.onmessage = function (event) { onMessage(opened, event); };
        socket.onclose = function () { onClose(opened); };
        socket.onerror = function () { /* onclose follows */ };
      }

      function onMessage(from, event) {
        if (from !== socket) { return; }
        if (typeof event.data !== 'string') {
          if (phase === 'open' && event.data instanceof ArrayBuffer) { decodeFrame(event.data); }
          return;
        }
        var message = pure.parseMessage(event.data);
        if (message === null) { return; }
        switch (message.type) {
          case 'hello': return onHello(message);
          case 'welcome': return onWelcome(message);
          case 'state': return onState(message);
          case 'bye': return onBye(message);
          default: return;
        }
      }

      function onHello(message) {
        if (phase !== 'connecting' || typeof message.challenge !== 'string') { return; }
        var answer = pure.proof(secretHex, PHONE_PREFIX, message.challenge);
        if (answer === null) { refuse(); return; }
        authSent = true;
        send({ type: 'auth', proof: answer, challenge: ownChallenge });
      }

      function onWelcome(message) {
        if (phase !== 'connecting') { return; }
        var expected = pure.proof(secretHex, DESKTOP_PREFIX, ownChallenge);
        if (expected === null || typeof message.proof !== 'string' || message.proof.toLowerCase() !== expected) {
          // The other end does not hold our secret: it is not our desktop, or
          // ours has forgotten us.
          refuse();
          return;
        }
        phase = 'open';
        everWelcomed = true;
        authFailures = 0;
        retryIndex = 0;
        state = message.state || null;
        startPings();
        render();
        syncPresence();
      }

      function onState(message) {
        if (phase !== 'open' || !message.state) { return; }
        state = message.state;
        render();
        syncPresence();
      }

      function onBye(message) {
        if (message.reason === 'replaced') {
          // A newer page from this phone took over; come back only once this
          // one is looked at again, so two pages never fight over the socket.
          phase = 'replaced';
          closeSocket();
          render();
          return;
        }
        refuse();
      }

      function onClose(from) {
        if (from !== socket) { return; }
        socket = null;
        stopPings();
        attached = false;
        attachedViewport = null;
        if (phase === 'refused' || phase === 'replaced') { render(); return; }
        var wasProving = phase === 'connecting';
        phase = 'connecting';
        render();
        if (wasProving) {
          probeEnrolment(authSent);
        } else {
          scheduleRetry();
        }
      }

      // A socket that ended before welcome: ask the plain route whether this
      // phone is still enrolled, since the browser hides why the upgrade failed.
      function probeEnrolment(afterAuth) {
        if (typeof window.fetch !== 'function') { scheduleRetry(); return; }
        window.fetch(pageAddress(), { method: 'GET', cache: 'no-store', credentials: 'same-origin' }).then(function (response) {
          if (response.status === 404) { refuse(); return; }
          if (afterAuth) {
            authFailures += 1;
            if (authFailures >= 2) { refuse(); return; }
          }
          scheduleRetry();
        }, function () {
          scheduleRetry();
        });
      }

      function scheduleRetry() {
        if (retryTimer !== null || phase === 'refused') { return; }
        var delay = RETRY_DELAYS_MILLIS[Math.min(retryIndex, RETRY_DELAYS_MILLIS.length - 1)];
        retryIndex += 1;
        retryTimer = setTimeout(function () { retryTimer = null; connect(); }, delay);
      }

      function refuse() {
        phase = 'refused';
        if (retryTimer !== null) { clearTimeout(retryTimer); retryTimer = null; }
        stopPings();
        closeSocket();
        render();
      }

      function closeSocket() {
        var closing = socket;
        socket = null;
        attached = false;
        attachedViewport = null;
        if (closing !== null) {
          closing.onclose = null;
          closing.onmessage = null;
          try { closing.close(); } catch (error) { /* already closed */ }
        }
      }

      function startPings() {
        stopPings();
        pingTimer = setInterval(function () { send({ type: 'ping' }); }, PING_MILLIS);
      }

      function stopPings() {
        if (pingTimer !== null) { clearInterval(pingTimer); pingTimer = null; }
      }

      function onVisibilityChange() {
        if (document.visibilityState === 'hidden') {
          leaveNow();
          return;
        }
        if (phase === 'replaced') {
          phase = 'connecting';
          retryIndex = 0;
          connect();
          return;
        }
        if (socket === null && phase !== 'refused') {
          retryIndex = 0;
          connect();
          return;
        }
        syncPresence();
      }

      function onResize() {
        if (resizeTimer !== null) { clearTimeout(resizeTimer); }
        resizeTimer = setTimeout(function () {
          resizeTimer = null;
          if (!el.game.hidden) { drawFrame(); }
          syncPresence();
        }, RESIZE_SETTLE_MILLIS);
        if (!el.game.hidden) { drawFrame(); }
      }

      function wire() {
        el.toggleSwitch.addEventListener('click', function () {
          sendIntent({ type: 'mobile', on: true });
        });
        el.listSwitch.addEventListener('click', function () {
          sendIntent({ type: 'mobile', on: false });
          setListOpen(false);
        });
        el.absentStart.addEventListener('click', function () {
          var account = pure.currentAccount(state);
          if (account !== null) { sendIntent({ type: 'start', account: account.id }); }
        });
        el.handle.addEventListener('click', function () { setListOpen(!listOpen); });
        el.scrim.addEventListener('click', function () { setListOpen(false); });
        el.frame.addEventListener('pointerdown', onPointerDown);
        el.frame.addEventListener('pointermove', onPointerMove);
        el.frame.addEventListener('pointerup', onPointerUp);
        el.frame.addEventListener('pointercancel', onPointerCancel);
        el.frame.addEventListener('contextmenu', function (event) { event.preventDefault(); });
        document.addEventListener('visibilitychange', onVisibilityChange);
        window.addEventListener('pagehide', leaveNow);
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', onResize);
      }

      secretHex = loadCredential();
      if (secretHex === null) {
        phase = 'refused';
        render();
        return;
      }
      wire();
      render();
      connect();
    })();
  </script>
</body>
</html>
