# cargo-deny: run by `make audit`. Every entry here is a deliberate decision —
# widening a list is a change to what the project is willing to ship.

[advisories]
yanked = "deny"
ignore = [
  # RUSTSEC-2024-0370 (`proc-macro-error` unmaintained). Reached only through
  # `wry`'s own optional Linux backend (`gtk 0.18` / `webkit2gtk` /
  # `glib-macros 0.18`), which this project never activates: `wry` is a
  # Windows-only dependency (`[target.'cfg(windows)'.dependencies]` in
  # `idle-manager-shell`), and `docs/tasks/12-windows-support/02-…`'s own
  # `cargo tree -p idle-manager-shell --target x86_64-unknown-linux-gnu`
  # criterion proves it never resolves into a Linux build. `cargo-deny`
  # audits the whole lock file regardless of which target activates which
  # edge — `[graph] targets` restricts by target triple, not by which crate's
  # *own* `cfg` gate reached a dependency, so it cannot narrow this one away
  # (tried 2026-09-17: still pulled in `webkit2gtk`, which shares the
  # `x86_64-unknown-linux-gnu` we do need for our real, `webkit6`-based
  # dependencies). No upgrade exists (the advisory's own "Solution" line).
  "RUSTSEC-2024-0370",
  # RUSTSEC-2024-0388 (`derivative` unmaintained). Reached through
  # `velopack` 1.2.158 (roadmap item 16 task 03, the crate that owns
  # packaging and the in-app update, the one place allowed to depend on it) →
  # `derivative`, one of Velopack's own direct dependencies. No upgrade
  # exists (the advisory's own "Solution" line: "No safe upgrade is
  # available!") and it is Velopack's choice to make, not ours. Remove this
  # entry the release a Velopack bump drops `derivative` from its own
  # dependency tree.
  "RUSTSEC-2024-0388",
]

[licenses]
confidence-threshold = 0.9

# The allow-list is deliberately wider than what is currently pulled in, so a
# routine dependency bump does not fail the build over a licence we would have
# accepted anyway. This stops cargo-deny reporting the unused entries.
unused-allowed-license = "allow"

allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Community Data License Agreement Permissive 2.0: permissive, attribution
  # only. Carried by `webpki-roots`, reached through `velopack` 1.2.158
  # (roadmap item 16 task 03) → `ureq` → `webpki-roots`, one of `ureq`'s own
  # TLS root-certificate dependencies. Remove this entry the release a
  # Velopack bump drops `webpki-roots` from its own dependency tree.
  "CDLA-Permissive-2.0",
  # The Independent JPEG Group licence: BSD-style, attribution only. Carried by
  # `jpeg-encoder` (roadmap item 13), which is `(MIT OR Apache-2.0) AND IJG`
  # because its quantisation tables and DCT are ported from libjpeg.
  "IJG",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# The workspace crates carry no `license` field because they are `publish =
# false` and never leave the repository.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

# A path dependency has no version requirement, which reads as a wildcard. The
# ban is there to catch `foo = "*"` from a registry, not our own crates.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
