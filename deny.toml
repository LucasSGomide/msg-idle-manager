# cargo-deny: run by `make audit`. Every entry here is a deliberate decision —
# widening a list is a change to what the project is willing to ship.

[advisories]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9

# The allow-list is deliberately wider than what is currently pulled in, so a
# routine dependency bump does not fail the build over a licence we would have
# accepted anyway. This stops cargo-deny reporting the unused entries.
unused-allowed-license = "allow"

allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# The workspace crates carry no `license` field because they are `publish =
# false` and never leave the repository.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

# A path dependency has no version requirement, which reads as a wildcard. The
# ban is there to catch `foo = "*"` from a registry, not our own crates.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
