[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
idle-manager-core = { path = "crates/idle-manager-core" }
idle-manager-metrics = { path = "crates/idle-manager-metrics" }
idle-manager-remote = { path = "crates/idle-manager-remote" }
idle-manager-shell = { path = "crates/idle-manager-shell" }
idle-manager-store = { path = "crates/idle-manager-store" }

gio = "0.22"
glib = "0.22"
# webkit6 0.6 names gtk::Accessible unconditionally, and gtk4 gates that type
# behind v4_10 without enabling it itself. v4_10 (March 2023) is therefore the
# real floor for the app, and stays the lowest GTK we can be built against.
gtk4 = { version = "0.11", features = ["v4_10"] }
webkit6 = "0.6"
glib-build-tools = "0.22"

# Windows only (roadmap item 12): the WebView2 engine seam. `wry` must never
# compile on Linux — it pulls in the GTK 3 `webkit2gtk`, which clashes with
# `webkit6` — so every crate below is taken under
# `[target.'cfg(windows)'.dependencies]`, never as an ordinary dependency.
wry = "0.57"
webview2-com = "0.39"
gdk4-win32 = { version = "0.11", features = ["win32"] }
raw-window-handle = "0.6"
windows = "0.62"

anyhow = "1.0"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The phone server (roadmap item 13): plain std threads and sockets, so none of
# these pulls in an async runtime or a GUI toolkit.
async-channel = "2.5"
base64 = "0.23"
hmac = "0.13"
if-addrs = "0.15"
jpeg-encoder = "0.7"
qrcode = "0.14"
rand = "0.10"
sha1 = "0.11"
sha2 = "0.11"

insta = "1.48"
rstest = "0.26"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "warn"
unwrap_used = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
